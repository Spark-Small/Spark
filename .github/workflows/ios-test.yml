name: iOS Tests

# Destination 须存在于 runner 已装模拟器；部署目标以
# 坐标系.xcodeproj IPHONEOS_DEPLOYMENT_TARGET（当前 26.5）为准。
# 升级 Xcode / 更换机型时同步改下方 destination。
# 基线 tag 规范见 Docs/RemainingReleaseClientPlan.md Wave-C（B2-7）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Check import boundaries
        run: bash Scripts/check-imports.sh

      - name: Run CoordinateDomain SPM tests
        run: |
          cd Packages/CoordinateKit
          swift test --parallel

      - name: Run unit tests
        run: |
          # 优先具名机型；本机常用 iPhone 18 Pro。若 runner 无该机型，可改为:
          # platform=iOS Simulator,name=iPhone 16 Pro
          # 或 generic/platform=iOS Simulator（需配合 -only-testing 稳定子集）
          xcodebuild test \
            -project "坐标系.xcodeproj" \
            -scheme "坐标系" \
            -destination "platform=iOS Simulator,name=iPhone 18 Pro" \
            -quiet
